modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Sistema de nubes procedurales que reemplaza por completo las nubes vanilla: campo de densidad
por región, slices horizontales, LOD por distancia y capa, culling con fade y caché con
presupuesto por frame. Incluye un harness de benchmark para medir contra vanilla.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="CLIENT"
