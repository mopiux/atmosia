// Scaffolding minimo para Forge 1.20.1 (ForgeGradle 6).
//
// SIN COMPILAR: el entorno donde se escribio esto no tiene acceso a maven.minecraftforge.net
// ni a los servidores de Mojang, asi que este archivo no pudo ejecutarse una sola vez.
// Se espera que la primera compilacion requiera ajustes menores.

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}"
group = "${mod_group_id}"
base { archivesName = "${mod_id}-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, minecraft_version: minecraft_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version
        ])
    }
}

// El codigo fuente del mod es ASCII puro a proposito, pero fijar la codificacion igual: sin esto
// javac usa la del sistema, que en un Windows en espanol es windows-1252, y cualquier caracter no
// ASCII que entre en el futuro llegaria al juego convertido en otro. Fue un error real: los
// acentos del menu se veian como simbolos sueltos.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}
